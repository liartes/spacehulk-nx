# gen_imports.py (runtime/tools): the modules whose imports the table serves
MODULES libmain.so libunity.so libmono.so
# Unity 5.3 extras: wchar_t is 4 bytes on both sides (wcslen is passthrough
# already), and swscanf is the read side of swprintf
PASSTHROUGH  wcscat wcscmp wcscpy wcsncat wcsncmp wcsncpy swscanf
